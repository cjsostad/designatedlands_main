[designatedlands]

# data source paths
dl_path=source_data
sources_designations=sources_designations.csv
sources_supporting=sources_supporting.csv

# write all outputs to this folder
out_path=outputs

# database url - using local PostgreSQL on standard port 5432
db_url=postgresql://postgres:1Tracker5@localhost:5432/designatedlands

# define resolution of raster processing
resolution=25

# n_processes default of -1 = (number of cores available - 1)
n_processes=4

