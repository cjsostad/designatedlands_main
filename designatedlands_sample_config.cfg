[designatedlands]

# -------------------------------------------------------------------------
# ArcGIS Pro-compatible configuration
# -------------------------------------------------------------------------

# Path to folder holding manually downloaded datasets
dl_path=source_data

# Source definition CSV files
sources_designations=sources_designations.csv
sources_supporting=sources_supporting.csv

# Path to write output GeoPackage and GeoTIFFs
out_path=outputs

# Path to the ArcGIS File Geodatabase used as the working database
# (replaces the old PostgreSQL db_url)
gdb_path=designatedlands.gdb

# Resolution of output GeoTIFF rasters (metres)
resolution=25

# Number of parallel processes to use.
# -1 = (number of CPU cores - 1)
n_processes=4
